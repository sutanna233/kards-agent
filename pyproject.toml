[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "kards-agent"
version = "0.1.0"
description = "在安卓模拟器上自主运行真实 KARDS 的 agent:读屏->决策->触摸注入"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
dependencies = [
    "numpy>=1.26",
    "opencv-python>=4.9",
    "Pillow>=10.0",
]

[project.optional-dependencies]
ocr = ["pytesseract>=0.3.10"]
llm = ["openai>=1.30"]

[tool.setuptools]
packages = ["kards_agent", "kards_agent.engine"]

[tool.pytest.ini_options]
testpaths = ["tests"]
